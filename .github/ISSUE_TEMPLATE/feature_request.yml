name: Feature request
description: Suggest an idea or improvement for this app
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please fill in as much detail as you can.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem or frustration is (e.g., "I'm always frustrated when...").
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any workarounds or alternative solutions you've thought about (optional).
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: How important is this feature to your workflow?
      options:
        - "Nice to have"
        - "Would save a lot of time"
        - "Critical / blocking my workflow"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
